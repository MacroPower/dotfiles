version: "3"

tasks:
  lint:
    desc: Check formatting and lint (nixfmt, deadnix, statix, shfmt, prettier, gofmt, rustfmt via treefmt)
    cmds:
      - dagger check nix:lint

  format:
    desc: Apply all auto-fixes (formatting and lint via treefmt)
    cmds:
      - dagger call nix format -y

  build:
    desc: Evaluate every darwin, NixOS, and home-manager configuration
    cmds:
      - dagger check nix:build

  # BuildHome of the nix toolchain is too slow for every run of
  # `dagger check`, so it does not carry the +check pragma and is not a
  # check. A `dagger check` pattern selects only checks, so the task
  # calls the function by name.
  build:home:
    desc: Build and activate each home-manager configuration for the platform of the Dagger engine
    cmds:
      - dagger call nix build-home

  flake-check:
    desc: Validate flake schema
    cmds:
      - dagger check nix:flake-check

  lock-diff:
    desc: Show changed direct flake inputs as JSON (defaults to HEAD vs working tree)
    cmds:
      - python3 {{.TASKFILE_DIR}}/scripts/flake-lock-diff.py {{.CLI_ARGS}}

  pkg-diff:
    desc: Show version changes of installed packages between a git rev (default HEAD) and the working tree
    cmds:
      - uv run {{.TASKFILE_DIR}}/scripts/flake-pkg-diff.py {{.CLI_ARGS}}

  build-plan:
    desc: Show what each host would compile locally instead of fetching, flagging cache misses new since a git rev (default HEAD)
    cmds:
      - uv run {{.TASKFILE_DIR}}/scripts/flake-build-plan.py {{.CLI_ARGS}}

  inventory:
    desc: Update README.md with installed package inventory (pass --staged to read the staged tree)
    cmds:
      - "{{.TASKFILE_DIR}}/scripts/update-inventory.sh {{.CLI_ARGS}}"
      - nix fmt -- README.md

  sbom:
    desc: Generate CycloneDX SBOM for the home-manager closure
    cmds:
      - dagger call nix sbom export --path sbom.cdx.json

  vulnscan:
    desc: Check home-manager closure for known CVEs
    cmds:
      - dagger call nix vulnscan

  # The task spells out one command for each update script, which is a
  # file that matches pkgs/*-update.sh. In the commit hook,
  # CheckPkgUpdate of the nix toolchain fails when a script has no
  # command here, or when a command names a script that does not exist.
  # It also fails when pkgs/<name>-update.sh exists and a package file
  # of that script does not. The package files of the script are
  # pkgs/<name>.nix and each pkgs/<file>.nix that the script names as
  # `$DIRNAME/<file>.nix`. Name each package file in a script that way,
  # because the check does not find a path of another form. Write each
  # command as `bash pkgs/<name>-update.sh`, because the check fails on
  # an entry of another form.
  pkg:update:
    desc: Update custom package derivations in pkgs/
    cmds:
      - bash pkgs/aven-update.sh
      - bash pkgs/chief-update.sh
      - bash pkgs/clauth-update.sh
      - bash pkgs/displayplacer-update.sh
      - bash pkgs/otel-tui-update.sh
      - bash pkgs/zed-update.sh
      - bash pkgs/photo-cli-update.sh
      - bash pkgs/radar-update.sh
      - bash pkgs/helm-schema-update.sh
      - bash pkgs/claude-powerline-update.sh
      - bash pkgs/leanspec-cli-update.sh
      - bash pkgs/playwright-cli-update.sh
