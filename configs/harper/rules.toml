# Every rule prose-lint enables, grouped by tier. A name with a
# rules/<Name>.weir file is a Weir rule, ProseHeading is the awk check
# in heading.awk, and any other name is a Harper built-in. Each name
# needs a fixtures/<Rule>.bad.md and fixtures/<Rule>.good.md pair, so a
# Harper upgrade that changes a built-in fails the build the same way
# a Weir edit does, and a typo in a built-in name fails because its
# bad fixture produces no lint.
#
# The tier sets how hard a finding pushes. A Required finding has a
# mechanical fix, so a file write asks for the fix and the Bash hook
# denies a commit or PR message with one every time. A Recommended
# finding comes from a shape detector that can misread a sentence, so
# the writer fixes it unless the rule misread the sentence, and the
# Bash hook denies a commit or PR message once; rerunning the identical
# command passes. An Optional finding is a suggestion the writer takes
# when the rewrite reads better, and it never denies a command on its
# own.
#
# Rules that misread identifiers, table cells, or technical
# abbreviations (SpellCheck, SentenceCapitalization, OxfordComma, the
# Expand* family) stay off on purpose.

# Exact phrases with a mechanical fix.
[required]
rules = [
  "ProseEmDash",
  "ProseBecause",
  "ProseInOrderTo",
  "ProseUse",
  "ProseHeading",
  "VeryUnique",
  "MoreBetter",
  "ComprisesOf",
  "RedundantSuperlatives",
  "RedundantProgressiveComparative",
  "CondenseAllThe",
  "AvoidAndAlso",
]

# Shape detectors that need judgment.
[recommended]
rules = [
  "ProsePassive",
  "ProseColonClause",
  "ProseParticipleTail",
  "ProseNotOnly",
  "ProseCertificate",
  "ProsePuff",
  "ProseTense",
  "LongSentences",
  "Hedging",
  "LitotesDirectPositive",
]

# Built-ins whose hits in technical prose are often false: RedundantThat
# fires on every grammatical `that that` (`the rule that that file
# defines`), MultipleFrequencyAdverbs on a schedule with its exception
# (`runs daily, never on weekends`), and Oxymorons on `found missing`.
[optional]
rules = [
  "RedundantThat",
  "MultipleFrequencyAdverbs",
  "Oxymorons",
]
